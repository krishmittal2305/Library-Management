name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore LibraryManagement.slnx || dotnet restore LibraryManagement.MVC/LibraryManagement.MVC.csproj
      
    - name: Build
      run: dotnet build LibraryManagement.MVC/LibraryManagement.MVC.csproj --no-restore --configuration Release
      
    # Note: Uncomment the following step once Unit Tests project is added
    # - name: Test
    #   run: dotnet test --no-build --verbosity normal --configuration Release
