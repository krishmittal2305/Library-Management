<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete Student – Library Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-icon"><i class="bi bi-book-half"></i></span>
        LibraryMS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-grid-fill"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="students.html"><i class="bi bi-people-fill"></i> Students</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="container">
      <h1><i class="bi bi-trash-fill me-2"></i>Delete Student</h1>
      <p>Remove a student from the system permanently.</p>
    </div>
  </div>

  <main class="container page-wrapper">
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html" class="text-primary text-decoration-none">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="students.html" class="text-primary text-decoration-none">Students</a></li>
        <li class="breadcrumb-item active" aria-current="page">Delete Student</li>
      </ol>
    </nav>
    
    <div id="alertSection" class="d-none mb-4">
      <div class="alert alert-danger" id="alertMsg"></div>
    </div>

    <div class="row justify-content-center" id="deleteSection">
      <div class="col-lg-6">
        <div class="card text-center py-5 shadow-sm border">
          <div class="card-body">
            <div class="confirm-icon danger mx-auto mb-3">
              <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h4 class="fw-700">Delete Student?</h4>
            <p class="text-muted mb-4">Are you sure you want to delete <strong id="delStuName" class="text-dark"></strong> (<span id="delStuEnrollment"></span>)? This action cannot be undone.</p>
            
            <div class="d-flex justify-content-center gap-2">
              <button class="btn btn-danger" id="btnConfirmDelete">
                <i class="bi bi-trash"></i> Yes, Delete
              </button>
              <a href="students.html" class="btn btn-outline-secondary">
                <i class="bi bi-x-lg"></i> Cancel
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <span><i class="bi bi-book-half me-1 text-primary"></i>Library Management System &copy; 2026</span>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/students.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    let currentStudentId = null;

    document.addEventListener("DOMContentLoaded", () => {
      setActiveNav();
      const id = getParam("id");
      if (!id) { showError("No student ID was provided."); return; }

      const student = getStudentById(id);
      if (!student) { showError("The requested student does not exist."); return; }

      currentStudentId = student.studentId;
      document.getElementById("delStuName").textContent = student.name;
      document.getElementById("delStuEnrollment").textContent = student.enrollmentNo;

      document.getElementById("btnConfirmDelete").addEventListener("click", handleDelete);
    });

    function showError(msg) {
      document.getElementById("deleteSection").classList.add("d-none");
      document.getElementById("alertSection").classList.remove("d-none");
      document.getElementById("alertMsg").innerHTML = `<i class="bi bi-exclamation-triangle-fill me-2"></i>${msg} <a href="students.html" class="alert-link ms-2">Go back to Students List.</a>`;
    }

    function handleDelete() {
      const success = deleteStudent(currentStudentId);
      if (success) {
        showToast("Student deleted successfully!", "success");
        setTimeout(() => goTo("students.html"), 1300);
      } else {
        showToast("Failed to delete student.", "danger");
      }
    }
  </script>
</body>
</html>
