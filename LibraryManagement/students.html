<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students – Library Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-icon"><i class="bi bi-book-half"></i></span>
        LibraryMS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-grid-fill"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-book-fill"></i> Books</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="students.html"><i class="bi bi-people-fill"></i> Students</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-clock-history"></i> Borrow History</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="container">
      <h1><i class="bi bi-people-fill me-2"></i>Students</h1>
      <p>Manage registered students in the library system.</p>
    </div>
  </div>

  <main class="container page-wrapper">
    <!-- Toolbar -->
    <div class="card mb-4">
      <div class="card-body p-3 d-flex flex-column flex-sm-row gap-3 align-items-sm-center justify-content-between">
        <div class="search-wrapper flex-grow-1" style="max-width:350px;">
          <i class="bi bi-search"></i>
          <input id="searchStudentInput" type="text" class="form-control" placeholder="Search by name, email or enrollment no…" />
        </div>
        <div>
          <a href="student-add.html" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Add New Student
          </a>
        </div>
      </div>
    </div>

    <!-- Student Table -->
    <div class="table-wrapper border shadow-sm mb-5">
      <table class="table" id="studentsTable">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Enrollment No</th>
            <th scope="col">Name</th>
            <th scope="col">Department</th>
            <th scope="col">Semester</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="studentsTableBody">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      <span><i class="bi bi-book-half me-1 text-primary"></i>Library Management System &copy; 2026</span>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/students.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      setActiveNav();
      renderStudents();

      document.getElementById("searchStudentInput").addEventListener("input", e => {
        renderStudents(e.target.value.trim().toLowerCase());
      });
    });

    function renderStudents(query = "") {
      const tbody = document.getElementById("studentsTableBody");
      let students = getAllStudents();

      if (query) {
        students = students.filter(s =>
          s.name.toLowerCase().includes(query) ||
          s.enrollmentNo.toLowerCase().includes(query) ||
          s.email.toLowerCase().includes(query)
        );
      }

      if (students.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="table-no-results py-5">
              <i class="bi bi-search fs-2 d-block mb-3 text-muted"></i>
              <p class="mb-0 fw-500">No students found matching your criteria.</p>
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = students.map((s, idx) => `
        <tr>
          <td class="text-muted fw-500">${idx + 1}</td>
          <td><code class="text-primary">${escHtml(s.enrollmentNo)}</code></td>
          <td class="fw-bold text-dark">${escHtml(s.name)}</td>
          <td class="text-secondary">${escHtml(s.department)}</td>
          <td>${s.semester}</td>
          <td>
            <div class="d-flex flex-wrap gap-1">
              <a href="student-details.html?id=${s.studentId}" class="btn btn-primary btn-action" title="View Details">
                <i class="bi bi-eye"></i>
              </a>
              <a href="student-edit.html?id=${s.studentId}" class="btn btn-success btn-action" title="Edit">
                <i class="bi bi-pencil"></i>
              </a>
              <a href="student-delete.html?id=${s.studentId}" class="btn btn-danger btn-action" title="Delete">
                <i class="bi bi-trash"></i>
              </a>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function escHtml(str) {
      if(!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
