<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borrow Book – Library Management System</title>
  <meta name="description" content="Borrow a book from the library by providing your contact details." />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-icon"><i class="bi bi-book-half"></i></span>
        LibraryMS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-grid-fill"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="add.html"><i class="bi bi-plus-circle-fill"></i> Add Book</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="container">
      <h1><i class="bi bi-person-check-fill me-2"></i>Borrow Book</h1>
      <p>Enter your details to borrow the selected book.</p>
    </div>
  </div>

  <!-- MAIN -->
  <main class="container page-wrapper">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html" class="text-primary text-decoration-none">Dashboard</a></li>
        <li class="breadcrumb-item active" aria-current="page">Borrow Book</li>
      </ol>
    </nav>

    <!-- Not Found / Already Borrowed -->
    <div id="alertSection" class="d-none">
      <div class="card text-center py-5">
        <div class="card-body">
          <div id="alertIcon" class="confirm-icon mx-auto mb-3"></div>
          <h4 id="alertTitle" class="fw-700"></h4>
          <p  id="alertMsg" class="text-muted"></p>
          <a href="index.html" class="btn btn-primary mt-2">
            <i class="bi bi-arrow-left me-1"></i> Back to Book List
          </a>
        </div>
      </div>
    </div>

    <!-- Borrow Form -->
    <div id="borrowSection" class="d-none">
      <div class="row g-4">

        <!-- Book Summary -->
        <div class="col-lg-4">
          <div class="card h-100">
            <div class="card-header"><i class="bi bi-book me-2 text-primary"></i>Book Details</div>
            <div class="card-body">
              <div class="book-cover-wrap mb-3" style="min-height:160px;">
                <i class="bi bi-book book-cover-icon" style="font-size:3rem;"></i>
              </div>
              <h6 id="borrow-book-title" class="fw-700 mb-1"></h6>
              <p  id="borrow-book-author" class="text-muted small mb-2"></p>
              <div class="small text-muted mb-2">
                <i class="bi bi-upc me-1"></i><span id="borrow-book-isbn"></span>
              </div>
              <div id="borrow-book-badge" class="mt-2"></div>
            </div>
          </div>
        </div>

        <!-- Borrower Form -->
        <div class="col-lg-8">
          <div class="card h-100">
            <div class="card-header"><i class="bi bi-person-fill me-2 text-primary"></i>Borrower Information</div>
            <div class="card-body">

              <form id="borrowForm" novalidate>

                <!-- Select Student -->
                <div class="mb-4">
                  <label for="borrowStudent" class="form-label">
                    <i class="bi bi-person me-1 text-primary"></i>Select Student <span class="text-danger">*</span>
                  </label>
                  <select class="form-select" id="borrowStudent" required>
                    <option value="" disabled selected>-- Choose a Student --</option>
                    <!-- Populated by JS -->
                  </select>
                  <div class="invalid-feedback">Please select a student.</div>
                </div>

                <!-- Info: borrow date -->
                <div class="alert alert-info d-flex align-items-center gap-2 py-2" role="alert">
                  <i class="bi bi-calendar-check-fill"></i>
                  <span>Borrow date will be recorded as <strong id="todayDate"></strong>.</span>
                </div>

                <!-- Buttons -->
                <hr class="section-divider" />
                <div class="d-flex flex-wrap gap-3">
                  <button type="submit" class="btn btn-primary" id="btnConfirmBorrow">
                    <i class="bi bi-person-check"></i> Confirm Borrow
                  </button>
                  <a href="index.html" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg"></i> Cancel
                  </a>
                </div>

              </form>
            </div>
          </div>
        </div>

      </div>
    </div><!-- /borrowSection -->

  </main>

  <footer>
    <div class="container text-center">
      <span><i class="bi bi-book-half me-1 text-primary"></i>Library Management System &copy; 2026</span>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/students.js"></script>
  <script src="js/books.js"></script>
  <script src="js/app.js"></script>

  <script>
    let currentBook = null;

    document.addEventListener("DOMContentLoaded", () => {
      setActiveNav();

      // Display today's date in the alert
      const today = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
      const el = document.getElementById("todayDate");
      if (el) el.textContent = today;

      const id = getParam("id");
      if (!id) { showAlert("danger", "Book Not Found", "No book ID was provided."); return; }

      currentBook = getBookById(id);
      if (!currentBook) { showAlert("danger", "Book Not Found", "The requested book does not exist."); return; }

      if (!currentBook.available) {
        // Resolve student name if available
        let borrowerName = "someone";
        if (currentBook.borrower && currentBook.borrower.studentId) {
          const student = getStudentById(currentBook.borrower.studentId);
          if (student) borrowerName = student.name;
        }

        showAlert("warning", "Book Already Borrowed",
          `"${currentBook.title}" is currently borrowed by ${borrowerName}.
           Please wait until it is returned.`);
        return;
      }

      // Populate students dropdown
      const studentSelect = document.getElementById("borrowStudent");
      const students = getAllStudents();
      students.forEach(s => {
        const option = document.createElement("option");
        option.value = s.studentId;
        option.textContent = `${s.name} (${s.enrollmentNo})`;
        studentSelect.appendChild(option);
      });

      // Book is available — show form
      document.getElementById("borrowSection").classList.remove("d-none");
      document.getElementById("borrow-book-title").textContent  = currentBook.title;
      document.getElementById("borrow-book-author").textContent = `by ${currentBook.author}`;
      document.getElementById("borrow-book-isbn").textContent   = currentBook.isbn;
      document.getElementById("borrow-book-badge").innerHTML    = availabilityBadge(currentBook.available);

      document.getElementById("borrowForm").addEventListener("submit", handleBorrow);
    });

    function showAlert(type, title, msg) {
      const iconMap = { danger: "bi-exclamation-triangle-fill", warning: "bi-exclamation-circle-fill", info: "bi-info-circle-fill" };
      document.getElementById("alertSection").classList.remove("d-none");
      document.getElementById("alertIcon").className  = `confirm-icon ${type} mx-auto mb-3`;
      document.getElementById("alertIcon").innerHTML  = `<i class="bi ${iconMap[type] || iconMap.info}"></i>`;
      document.getElementById("alertTitle").textContent = title;
      document.getElementById("alertMsg").textContent   = msg;
    }

    function handleBorrow(e) {
      e.preventDefault();
      const form = e.target;
      if (!validateForm(form)) return;

      const studentId = document.getElementById("borrowStudent").value;
      borrowBook(currentBook.id, studentId);

      showToast(`"${currentBook.title}" borrowed successfully!`, "success");
      setTimeout(() => goTo("details.html", currentBook.id), 1300);
    }
  </script>
</body>
</html>
